<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Your Interview &middot; AMS Landscaping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<style>
  :root {
    --green: #2d7a3a;
    --green-dark: #245f2e;
    --green-light: #e8f3ea;
    --ink: #1c2b1f;
    --muted: #5e6f62;
    --line: #dde6df;
    --bg: #f6f8f6;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 64px; }
  header { text-align: center; margin-bottom: 36px; }
  .brand {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--green);
    background: var(--green-light);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  .subtitle { font-size: 16px; color: var(--muted); max-width: 520px; margin: 0 auto; }
  .infobar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 40px;
  }
  .infoitem {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .infoitem svg { width: 18px; height: 18px; stroke: var(--green); flex-shrink: 0; }
  .days { display: flex; flex-direction: column; gap: 18px; }
  .daycard {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    display: flex;
    gap: 22px;
    align-items: flex-start;
  }
  .datebadge {
    flex-shrink: 0;
    width: 64px;
    text-align: center;
    background: var(--green-light);
    border-radius: 10px;
    padding: 10px 0;
  }
  .datebadge .mon {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--green);
  }
  .datebadge .day { font-size: 26px; font-weight: 800; color: var(--ink); line-height: 1.1; }
  .daybody { flex: 1; min-width: 0; }
  .dayhead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .weekday { font-size: 17px; font-weight: 700; }
  .slotcount { font-size: 13px; color: var(--muted); }
  .times { display: flex; flex-wrap: wrap; gap: 10px; }
  .slot {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--green-dark);
    background: var(--white);
    border: 1.5px solid var(--green);
    border-radius: 9px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.05s;
  }
  .slot:hover { background: var(--green); color: var(--white); }
  .slot:active { transform: scale(0.97); }
  .empty {
    background: var(--white);
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 16px;
  }
  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  /* modal */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 35, 24, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 1000;
  }
  .backdrop.open { display: flex; }
  .modal {
    background: var(--white);
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .modal .check {
    width: 52px; height: 52px;
    margin: 0 auto 16px;
    background: var(--green-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .modal .check svg { width: 26px; height: 26px; stroke: var(--green); }
  .modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .modal .picked {
    font-size: 16px;
    font-weight: 600;
    color: var(--green-dark);
    background: var(--green-light);
    border-radius: 10px;
    padding: 12px;
    margin: 16px 0;
  }
  .modal p { font-size: 14px; color: var(--muted); margin-bottom: 22px; }
  .btn-primary {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
    background: var(--green);
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    width: 100%;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-text {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 14px;
    padding: 6px;
  }
  .btn-text:hover { color: var(--ink); }
  @media (max-width: 560px) {
    h1 { font-size: 27px; }
    .daycard { flex-direction: column; gap: 14px; }
    .datebadge { width: 100%; display: flex; gap: 10px; justify-content: center; align-items: baseline; }
    .datebadge .day { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">AMS Landscaping &middot; azlawns.com</span>
    <h1>Schedule Your Interview</h1>
    <p class="subtitle">Pick any available time below. These slots are confirmed open for both interviewers.</p>
  </header>

  <div class="infobar">
    <div class="infoitem">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
      30 minutes
    </div>
    <div class="infoitem">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      Zoom link sent after booking
    </div>
    <div class="infoitem">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      Appointment Setter Role
    </div>
  </div>

  <div class="days" id="days"></div>

  <footer id="footer"></footer>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h2>Confirm your time</h2>
    <div class="picked" id="picked"></div>
    <p>You'll finish booking on the next screen and get a Zoom link by email.</p>
    <button class="btn-primary" id="continueBtn">Continue to Book &rarr;</button>
    <br>
    <button class="btn-text" id="goBackBtn">Go back</button>
  </div>
</div>

<script src="https://assets.calendly.com/assets/external/widget.js"></script>
<script>
  const availableSlots = [
  {
    "date": "2026-05-18",
    "times": [
      "9:00 AM",
      "9:30 AM",
      "10:00 AM",
      "10:30 AM",
      "11:00 AM",
      "11:30 AM",
      "12:00 PM",
      "1:00 PM",
      "1:30 PM",
      "2:00 PM",
      "2:30 PM",
      "3:00 PM",
      "3:30 PM",
      "4:00 PM",
      "4:30 PM"
    ]
  },
  {
    "date": "2026-05-19",
    "times": [
      "10:30 AM",
      "12:00 PM",
      "12:30 PM",
      "1:00 PM",
      "2:30 PM"
    ]
  },
  {
    "date": "2026-05-21",
    "times": [
      "9:30 AM",
      "4:00 PM"
    ]
  },
  {
    "date": "2026-05-25",
    "times": [
      "9:30 AM",
      "10:00 AM",
      "10:30 AM",
      "11:00 AM",
      "11:30 AM",
      "12:00 PM",
      "12:30 PM",
      "1:00 PM",
      "1:30 PM",
      "2:00 PM"
    ]
  },
  {
    "date": "2026-05-26",
    "times": [
      "10:30 AM",
      "12:00 PM",
      "12:30 PM",
      "1:00 PM"
    ]
  },
  {
    "date": "2026-05-27",
    "times": [
      "12:00 PM",
      "12:30 PM",
      "1:00 PM",
      "1:30 PM",
      "2:00 PM",
      "2:30 PM",
      "3:00 PM",
      "3:30 PM",
      "4:00 PM",
      "4:30 PM"
    ]
  },
  {
    "date": "2026-05-28",
    "times": [
      "11:00 AM",
      "11:30 AM",
      "12:00 PM",
      "12:30 PM",
      "3:00 PM",
      "3:30 PM",
      "4:00 PM",
      "4:30 PM"
    ]
  },
  {
    "date": "2026-05-29",
    "times": [
      "9:30 AM",
      "10:00 AM",
      "10:30 AM",
      "11:00 AM",
      "11:30 AM",
      "12:00 PM",
      "12:30 PM",
      "1:00 PM",
      "1:30 PM",
      "2:00 PM"
    ]
  }
];

  const CALENDLY_BASE = 'https://calendly.com/d/cxyz-jtx-662/setter-interview';
  const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  let selected = null;

  function todayKey() {
    const n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
  }

  function render() {
    const container = document.getElementById('days');
    const tk = todayKey();
    const upcoming = availableSlots.filter(d => d.date >= tk && d.times && d.times.length);

    if (!upcoming.length) {
      container.innerHTML = '<div class="empty">No open slots right now &mdash; check back soon or reach out at azlawns.com</div>';
      return;
    }

    upcoming.forEach(d => {
      const parts = d.date.split('-');
      const dt = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
      const card = document.createElement('div');
      card.className = 'daycard';

      const badge = document.createElement('div');
      badge.className = 'datebadge';
      badge.innerHTML = '<div class="mon">' + MONTHS[dt.getMonth()] + '</div><div class="day">' + dt.getDate() + '</div>';

      const body = document.createElement('div');
      body.className = 'daybody';
      const head = document.createElement('div');
      head.className = 'dayhead';
      head.innerHTML = '<span class="weekday">' + WEEKDAYS[dt.getDay()] + '</span><span class="slotcount">' + d.times.length + (d.times.length === 1 ? ' slot' : ' slots') + ' open</span>';
      body.appendChild(head);

      const times = document.createElement('div');
      times.className = 'times';
      d.times.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'slot';
        btn.textContent = t;
        btn.addEventListener('click', () => openModal(d.date, t, dt));
        times.appendChild(btn);
      });
      body.appendChild(times);

      card.appendChild(badge);
      card.appendChild(body);
      container.appendChild(card);
    });
  }

  function openModal(dateStr, timeStr, dtObj) {
    const month = dateStr.slice(0, 7);
    selected = { url: CALENDLY_BASE + '?month=' + month };
    const label = WEEKDAYS[dtObj.getDay()] + ', ' + MONTHS[dtObj.getMonth()] + ' ' + dtObj.getDate() + '  ·  ' + timeStr;
    document.getElementById('picked').textContent = label;
    document.getElementById('backdrop').classList.add('open');
  }

  function closeModal() {
    document.getElementById('backdrop').classList.remove('open');
    selected = null;
  }

  document.getElementById('continueBtn').addEventListener('click', () => {
    if (!selected) return;
    if (window.Calendly && typeof window.Calendly.initPopupWidget === 'function') {
      window.Calendly.initPopupWidget({ url: selected.url });
    } else {
      window.open(selected.url, '_blank');
    }
    closeModal();
  });

  document.getElementById('goBackBtn').addEventListener('click', closeModal);
  document.getElementById('backdrop').addEventListener('click', (e) => {
    if (e.target === document.getElementById('backdrop')) closeModal();
  });

  document.getElementById('footer').textContent =
    'Times shown in Phoenix, AZ (MST)  ·  Availability as of May 15, 2026';

  render();
</script>
</body>
</html>
