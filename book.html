<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Schedule Your Interview · AMS Landscaping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
<style>
:root {
  --green: #2d7a3a;
  --green-dark: #225f2c;
  --green-light: #e8f3ea;
  --green-tint: #f4faf5;
  --ink: #1a2a1d;
  --ink-soft: #4a5a4d;
  --muted: #7a8a7d;
  --line: #e3ebe5;
  --bg: #fafbfa;
  --white: #ffffff;
  --shadow-sm: 0 1px 3px rgba(20,40,25,0.06), 0 1px 2px rgba(20,40,25,0.04);
  --shadow-md: 0 4px 12px rgba(20,40,25,0.08), 0 2px 4px rgba(20,40,25,0.05);
  --shadow-lg: 0 12px 32px rgba(20,40,25,0.12), 0 4px 8px rgba(20,40,25,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; line-height: 1.5; }
.container { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
.brand-label { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--green); margin-bottom: 24px; }
.brand-label::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
h1 { font-size: 44px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; margin-bottom: 14px; color: var(--ink); }
.subtitle { font-size: 18px; color: var(--ink-soft); max-width: 560px; line-height: 1.55; margin-bottom: 36px; }
.info-bar { display: flex; flex-wrap: wrap; gap: 24px; padding: 20px 24px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); margin-bottom: 40px; }
.info-item { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: var(--ink-soft); }
.info-item svg { width: 18px; height: 18px; color: var(--green); flex-shrink: 0; }
.day-card { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 28px; margin-bottom: 16px; box-shadow: var(--shadow-sm); transition: box-shadow 0.15s ease; }
.day-card:hover { box-shadow: var(--shadow-md); }
.day-header { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.date-badge { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; height: 64px; background: var(--green-light); border-radius: 12px; flex-shrink: 0; }
.date-badge .month { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--green); }
.date-badge .day { font-size: 24px; font-weight: 800; color: var(--green-dark); line-height: 1; }
.day-meta { flex: 1; min-width: 0; }
.day-name { font-size: 19px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
.slot-count { font-size: 13px; color: var(--muted); font-weight: 500; }
.slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.slot-btn { padding: 12px 16px; background: var(--white); border: 1.5px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--ink); cursor: pointer; transition: all 0.15s ease; text-align: center; }
.slot-btn:hover { border-color: var(--green); background: var(--green-tint); color: var(--green-dark); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.slot-btn:active { transform: translateY(0); }
.empty-state { background: var(--white); border: 1px dashed var(--line); border-radius: 16px; padding: 48px 32px; text-align: center; color: var(--ink-soft); font-size: 16px; }
.empty-state .emoji { font-size: 32px; display: block; margin-bottom: 12px; opacity: 0.7; }
.footer-note { margin-top: 40px; padding: 20px; text-align: center; font-size: 13px; color: var(--muted); line-height: 1.6; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(20,40,25,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; opacity: 0; transition: opacity 0.2s ease; }
.modal-backdrop.active { display: flex; opacity: 1; }
.modal { background: var(--white); border-radius: 18px; padding: 36px 32px; max-width: 420px; width: 100%; box-shadow: var(--shadow-lg); transform: scale(0.96); transition: transform 0.2s ease; }
.modal-backdrop.active .modal { transform: scale(1); }
.modal-icon { width: 56px; height: 56px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
.modal-icon svg { width: 28px; height: 28px; color: var(--green); }
.modal h2 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--ink); }
.modal p.modal-time { font-size: 16px; color: var(--ink-soft); text-align: center; margin-bottom: 24px; font-weight: 500; }
.modal-time strong { color: var(--green-dark); font-weight: 700; }
.modal-actions { display: flex; flex-direction: column; gap: 10px; }
.btn-primary { padding: 14px 20px; background: var(--green); color: var(--white); border: none; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s ease; }
.btn-primary:hover { background: var(--green-dark); }
.btn-ghost { padding: 12px 20px; background: transparent; color: var(--ink-soft); border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: color 0.15s ease; }
.btn-ghost:hover { color: var(--ink); }
@media (max-width: 600px) {
  .container { padding: 32px 18px 60px; }
  h1 { font-size: 34px; }
  .subtitle { font-size: 16px; }
  .info-bar { flex-direction: column; gap: 12px; padding: 18px 20px; }
  .day-card { padding: 22px 20px; }
  .day-header { gap: 14px; }
  .slot-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .slot-btn { padding: 10px 12px; font-size: 14px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="brand-label">AMS Landscaping &middot; azlawns.com</div>
  <h1>Schedule Your Interview</h1>
  <p class="subtitle">Pick any available time below. These slots are confirmed open for both interviewers.</p>

  <div class="info-bar">
    <div class="info-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      30 minutes
    </div>
    <div class="info-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Zoom link sent after booking
    </div>
    <div class="info-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Appointment Setter Role
    </div>
  </div>

  <div id="slots-container"></div>

  <p class="footer-note">Times shown in Phoenix, AZ (MST) &middot; Availability as of May 07, 2026</p>
</div>

<div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
    </div>
    <h2>Confirm your slot</h2>
    <p class="modal-time" id="modal-time"></p>
    <div class="modal-actions">
      <button class="btn-primary" onclick="continueToCalendly()">Continue to Book &rarr;</button>
      <button class="btn-ghost" onclick="closeModal()">Go back</button>
    </div>
  </div>
</div>

<script>
const availableSlots = [{"date": "2026-05-07", "times": ["2:00 PM"]}, {"date": "2026-05-12", "times": ["10:30 AM", "1:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM"]}, {"date": "2026-05-13", "times": ["10:00 AM", "1:30 PM", "2:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM"]}, {"date": "2026-05-14", "times": ["11:00 AM", "11:30 AM", "12:00 PM", "12:30 PM", "1:00 PM", "1:30 PM", "2:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM"]}, {"date": "2026-05-15", "times": ["10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM", "12:00 PM", "12:30 PM", "1:00 PM", "1:30 PM", "2:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM"]}, {"date": "2026-05-18", "times": ["9:00 AM", "9:30 AM", "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM", "12:00 PM", "12:30 PM", "1:00 PM", "1:30 PM", "2:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM"]}, {"date": "2026-05-19", "times": ["10:30 AM", "12:00 PM", "12:30 PM", "1:00 PM", "2:30 PM"]}, {"date": "2026-05-21", "times": ["9:30 AM"]}];

const CALENDLY_BASE = 'https://calendly.com/d/cxyz-jtx-662/setter-interview';
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

let selectedSlot = null;

function todayLocalISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function formatDayLabel(dateStr) {
  const d = parseDate(dateStr);
  return {
    weekday: WEEKDAYS[d.getDay()],
    monthShort: MONTHS_SHORT[d.getMonth()],
    monthLong: MONTHS_LONG[d.getMonth()],
    day: d.getDate(),
    yearMonth: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
  };
}

function render() {
  const today = todayLocalISO();
  const upcoming = availableSlots.filter(s => s.date >= today && s.times.length > 0);
  const container = document.getElementById('slots-container');

  if (upcoming.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <span class="emoji">&#128197;</span>
        <strong>No open slots right now</strong> &mdash; check back soon or reach out at azlawns.com
      </div>`;
    return;
  }

  container.innerHTML = upcoming.map(slot => {
    const lbl = formatDayLabel(slot.date);
    const slotBtns = slot.times.map(t => 
      `<button class="slot-btn" onclick="openModal('${slot.date}','${t}','${lbl.yearMonth}')">${t}</button>`
    ).join('');
    const countLabel = slot.times.length === 1 ? '1 slot available' : `${slot.times.length} slots available`;
    return `
      <div class="day-card">
        <div class="day-header">
          <div class="date-badge">
            <div class="month">${lbl.monthShort}</div>
            <div class="day">${lbl.day}</div>
          </div>
          <div class="day-meta">
            <div class="day-name">${lbl.weekday}, ${lbl.monthLong} ${lbl.day}</div>
            <div class="slot-count">${countLabel}</div>
          </div>
        </div>
        <div class="slot-grid">${slotBtns}</div>
      </div>`;
  }).join('');
}

function openModal(date, time, yearMonth) {
  const lbl = formatDayLabel(date);
  selectedSlot = { date, time, yearMonth };
  document.getElementById('modal-time').innerHTML = 
    `<strong>${lbl.weekday}, ${lbl.monthLong} ${lbl.day}</strong> at <strong>${time}</strong>`;
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
  selectedSlot = null;
}

function continueToCalendly() {
  if (!selectedSlot) return;
  const url = `${CALENDLY_BASE}?month=${selectedSlot.yearMonth}`;
  if (window.Calendly && typeof window.Calendly.initPopupWidget === 'function') {
    window.Calendly.initPopupWidget({ url });
    closeModal();
  } else {
    window.open(url, '_blank');
    closeModal();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
