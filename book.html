<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Your Interview · AMS Landscaping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
<style>
  :root{
    --green:#2d7a3a; --green-dark:#1f5a29; --green-light:#e8f3ea;
    --ink:#1a2420; --muted:#5c6b62; --line:#e2e8e4; --bg:#f5f8f6; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 64px}
  .brand{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--green);letter-spacing:.02em;text-transform:uppercase;margin-bottom:18px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  .subtitle{font-size:16px;color:var(--muted);max-width:520px;margin-bottom:26px}
  .infobar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
  .infobar .item{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;color:var(--ink)}
  .infobar svg{width:16px;height:16px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .day{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .day-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .badge{flex:0 0 auto;width:56px;height:60px;border-radius:12px;background:var(--green-light);color:var(--green-dark);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .badge .mon{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .badge .num{font-size:24px;font-weight:800;line-height:1}
  .day-meta .wd{font-size:17px;font-weight:700}
  .day-meta .cnt{font-size:13px;color:var(--muted)}
  .times{display:flex;flex-wrap:wrap;gap:10px}
  .slot{font-family:inherit;font-size:15px;font-weight:600;color:var(--green-dark);background:var(--white);border:1.5px solid var(--green);border-radius:10px;padding:10px 18px;cursor:pointer;transition:.15s}
  .slot:hover{background:var(--green);color:#fff;transform:translateY(-1px)}
  .empty{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:40px 24px;text-align:center;color:var(--muted);font-size:16px}
  .empty a{color:var(--green);font-weight:600;text-decoration:none}
  .foot{margin-top:30px;font-size:13px;color:var(--muted);text-align:center}
  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(20,30,25,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .backdrop.open{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:30px 28px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal .check{width:52px;height:52px;border-radius:50%;background:var(--green-light);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
  .modal .check svg{width:26px;height:26px;stroke:var(--green);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .modal h3{font-size:20px;font-weight:800;margin-bottom:6px}
  .modal .sel{font-size:16px;color:var(--green-dark);font-weight:700;margin-bottom:4px}
  .modal p{font-size:14px;color:var(--muted);margin-bottom:22px}
  .btn-primary{display:block;width:100%;font-family:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--green);border:none;border-radius:11px;padding:14px;cursor:pointer;transition:.15s}
  .btn-primary:hover{background:var(--green-dark)}
  .btn-ghost{display:block;width:100%;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);background:none;border:none;padding:12px 0 0;cursor:pointer}
  @media(max-width:480px){h1{font-size:27px}.wrap{padding:24px 16px 48px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>AMS Landscaping · azlawns.com</div>
  <h1>Schedule Your Interview</h1>
  <p class="subtitle">Pick any available time below. These slots are confirmed open for both interviewers.</p>
  <div class="infobar">
    <span class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>30 minutes</span>
    <span class="item"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>Zoom link sent after booking</span>
    <span class="item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Appointment Setter Role</span>
  </div>
  <div id="slots"></div>
  <p class="foot">Times shown in Phoenix, AZ (MST) · Availability as of June 18, 2026</p>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h3>Confirm your time</h3>
    <div class="sel" id="selDate"></div>
    <p id="selTime"></p>
    <button class="btn-primary" id="continueBtn">Continue to Book &rarr;</button>
    <button class="btn-ghost" id="goBack">Go back</button>
  </div>
</div>

<script>
  const availableSlots = [{"date": "2026-06-18", "times": ["3:00 PM", "3:30 PM"]}, {"date": "2026-06-22", "times": ["4:15 PM"]}, {"date": "2026-06-23", "times": ["4:15 PM"]}, {"date": "2026-06-25", "times": ["3:15 PM"]}, {"date": "2026-06-29", "times": ["4:00 PM", "4:30 PM"]}, {"date": "2026-06-30", "times": ["10:30 AM", "12:00 PM", "12:30 PM", "1:00 PM", "2:30 PM", "3:00 PM", "3:30 PM", "4:00 PM", "4:30 PM"]}, {"date": "2026-07-01", "times": ["10:00 AM", "1:00 PM", "1:30 PM", "3:30 PM", "4:00 PM", "4:30 PM"]}];
  const CALENDLY_BASE = "https://calendly.com/d/cxyz-jtx-662/setter-interview";
  const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MO = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function todayKey(){const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}

  let selected = null;

  function render(){
    const tk = todayKey();
    const live = availableSlots.filter(d => d.date >= tk && d.times && d.times.length);
    const root = document.getElementById('slots');
    if(!live.length){
      root.innerHTML = '<div class="empty">No open slots right now &mdash; check back soon or reach out at <a href="https://azlawns.com">azlawns.com</a></div>';
      return;
    }
    root.innerHTML = live.map(d => {
      const dt = new Date(d.date + 'T12:00:00');
      const wd = WD[dt.getDay()];
      const mon = MO[dt.getMonth()];
      const num = dt.getDate();
      const cnt = d.times.length + (d.times.length===1?' open time':' open times');
      const btns = d.times.map(t => '<button class="slot" data-date="'+d.date+'" data-time="'+t+'">'+t+'</button>').join('');
      return '<div class="day"><div class="day-head"><div class="badge"><span class="mon">'+mon+'</span><span class="num">'+num+'</span></div>'+
             '<div class="day-meta"><div class="wd">'+wd+'</div><div class="cnt">'+cnt+'</div></div></div>'+
             '<div class="times">'+btns+'</div></div>';
    }).join('');
    document.querySelectorAll('.slot').forEach(b => b.addEventListener('click', () => openModal(b.dataset.date, b.dataset.time)));
  }

  function openModal(dateStr, time){
    selected = {date: dateStr, time: time};
    const dt = new Date(dateStr + 'T12:00:00');
    document.getElementById('selDate').textContent = WD[dt.getDay()] + ', ' + dt.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    document.getElementById('selTime').textContent = time + ' Phoenix time (MST)';
    document.getElementById('backdrop').classList.add('open');
  }
  function closeModal(){document.getElementById('backdrop').classList.remove('open');}

  document.getElementById('goBack').addEventListener('click', closeModal);
  document.getElementById('backdrop').addEventListener('click', e => { if(e.target.id==='backdrop') closeModal(); });

  document.getElementById('continueBtn').addEventListener('click', () => {
    const month = selected ? selected.date.slice(0,7) : '';
    const url = CALENDLY_BASE + '?month=' + month;
    if(window.Calendly && Calendly.initPopupWidget){
      Calendly.initPopupWidget({url: url});
    } else {
      window.open(url, '_blank');
    }
    closeModal();
  });

  render();
</script>
</body>
</html>
