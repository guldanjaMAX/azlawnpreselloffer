<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule Your Interview · AMS Landscaping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<script src="https://assets.calendly.com/assets/external/widget.js" async></script>
<style>
  :root {
    --green: #2d7a3a;
    --green-dark: #245f2e;
    --green-light: #e8f3ea;
    --ink: #1a2b1e;
    --muted: #5c6b60;
    --line: #e2e8e3;
    --bg: #f6f8f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }

  header { text-align: center; margin-bottom: 28px; }
  .brand {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--green);
    background: var(--green-light);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
  .subtitle { color: var(--muted); font-size: 16px; max-width: 540px; margin: 0 auto; }

  .infobar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 26px 0 34px;
  }
  .infobar .item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .infobar .item svg { width: 18px; height: 18px; color: var(--green); flex-shrink: 0; }

  .day-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(20,40,25,0.04);
  }
  .day-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .date-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 58px;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    flex-shrink: 0;
  }
  .date-badge .mon { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .date-badge .num { font-size: 24px; font-weight: 800; line-height: 1; }
  .day-meta .weekday { font-size: 18px; font-weight: 700; }
  .day-meta .count { font-size: 13px; color: var(--muted); }

  .times { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .slot-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--green-dark);
    background: #fff;
    border: 1.5px solid var(--green);
    border-radius: 10px;
    padding: 11px 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .slot-btn:hover { background: var(--green); color: #fff; transform: translateY(-1px); }

  .empty-state {
    background: #fff;
    border: 1px dashed var(--line);
    border-radius: 16px;
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 16px;
  }

  footer { text-align: center; margin-top: 32px; font-size: 13px; color: var(--muted); }

  /* Modal */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(16,28,18,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    max-width: 400px;
    width: 100%;
    padding: 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal .check {
    width: 52px; height: 52px; margin: 0 auto 16px;
    border-radius: 50%; background: var(--green-light);
    display: flex; align-items: center; justify-content: center;
  }
  .modal .check svg { width: 26px; height: 26px; color: var(--green); }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .modal .sel-time { font-size: 16px; color: var(--green-dark); font-weight: 600; margin-bottom: 4px; }
  .modal p { font-size: 14px; color: var(--muted); margin-bottom: 22px; }
  .modal .btn-primary {
    width: 100%;
    font-family: inherit; font-size: 16px; font-weight: 600;
    color: #fff; background: var(--green);
    border: none; border-radius: 10px; padding: 13px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .modal .btn-primary:hover { background: var(--green-dark); }
  .modal .btn-back {
    margin-top: 12px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    color: var(--muted); background: none; border: none; cursor: pointer;
  }
  .modal .btn-back:hover { color: var(--ink); }

  @media (max-width: 560px) {
    h1 { font-size: 27px; }
    .times { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">AMS Landscaping · azlawns.com</span>
    <h1>Schedule Your Interview</h1>
    <p class="subtitle">Pick any available time below. These slots are confirmed open for both interviewers.</p>
  </header>

  <div class="infobar">
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      30 minutes
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      Zoom link sent after booking
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Appointment Setter Role
    </div>
  </div>

  <div id="slots"></div>

  <footer id="footer"></footer>
</div>

<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h3>Confirm your time</h3>
    <div class="sel-time" id="modalTime"></div>
    <p>You'll finish booking on the next screen and get a Zoom link by email.</p>
    <button class="btn-primary" id="continueBtn">Continue to Book &rarr;</button>
    <button class="btn-back" id="backBtn">Go back</button>
  </div>
</div>

<script>
  const CALENDLY_BASE = "https://calendly.com/d/cxyz-jtx-662/setter-interview";

  const availableSlots = [
    { date: '2026-07-08', times: ['10:30 AM', '12:00 PM', '12:30 PM', '1:00 PM', '1:30 PM', '3:30 PM'] },
    { date: '2026-07-09', times: ['11:00 AM', '11:30 AM', '12:00 PM', '12:30 PM', '2:30 PM', '3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM'] },
    { date: '2026-07-10', times: ['9:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '12:00 PM', '12:30 PM'] },
    { date: '2026-07-13', times: ['3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM'] },
    { date: '2026-07-14', times: ['10:30 AM', '11:00 AM', '11:30 AM', '12:00 PM', '12:30 PM', '1:00 PM', '2:30 PM'] },
    { date: '2026-07-15', times: ['10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '1:00 PM', '1:30 PM'] },
    { date: '2026-07-16', times: ['9:30 AM', '3:30 PM', '4:00 PM', '4:30 PM'] },
    { date: '2026-07-17', times: ['9:00 AM', '9:30 AM', '10:00 AM', '10:30 AM', '11:00 AM', '11:30 AM', '12:00 PM', '12:30 PM', '1:00 PM', '1:30 PM', '2:00 PM', '2:30 PM', '3:00 PM', '3:30 PM', '4:00 PM', '4:30 PM'] },
    { date: '2026-07-20', times: ['1:00 PM', '1:30 PM', '2:00 PM', '3:30 PM', '4:00 PM', '4:30 PM'] },
  ];

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  function localMidnight(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function render() {
    const container = document.getElementById('slots');
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const upcoming = availableSlots.filter(s => localMidnight(s.date) >= today && s.times.length);

    if (!upcoming.length) {
      container.innerHTML = '<div class="empty-state">No open slots right now &mdash; check back soon or reach out at azlawns.com</div>';
      return;
    }

    container.innerHTML = upcoming.map(day => {
      const dt = localMidnight(day.date);
      const mon = MONTHS[dt.getMonth()];
      const num = dt.getDate();
      const weekday = WEEKDAYS[dt.getDay()];
      const count = day.times.length + (day.times.length === 1 ? ' open time' : ' open times');
      const buttons = day.times.map(t =>
        `<button class="slot-btn" data-date="${day.date}" data-time="${t}">${t}</button>`
      ).join('');
      return `
        <div class="day-card">
          <div class="day-head">
            <div class="date-badge"><span class="mon">${mon}</span><span class="num">${num}</span></div>
            <div class="day-meta"><div class="weekday">${weekday}</div><div class="count">${count}</div></div>
          </div>
          <div class="times">${buttons}</div>
        </div>`;
    }).join('');

    container.querySelectorAll('.slot-btn').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.dataset.date, btn.dataset.time));
    });
  }

  let selected = { date: null, time: null };
  const backdrop = document.getElementById('backdrop');

  function openModal(date, time) {
    selected = { date, time };
    const dt = localMidnight(date);
    const label = `${WEEKDAYS[dt.getDay()]}, ${MONTHS[dt.getMonth()]} ${dt.getDate()} at ${time}`;
    document.getElementById('modalTime').textContent = label;
    backdrop.classList.add('open');
  }

  function closeModal() { backdrop.classList.remove('open'); }

  document.getElementById('backBtn').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });

  document.getElementById('continueBtn').addEventListener('click', () => {
    const ym = selected.date ? selected.date.slice(0, 7) : '';
    const url = `${CALENDLY_BASE}?month=${ym}`;
    if (window.Calendly && typeof window.Calendly.initPopupWidget === 'function') {
      window.Calendly.initPopupWidget({ url });
    } else {
      window.open(url, '_blank');
    }
    closeModal();
  });

  const footerDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('footer').textContent =
    `Times shown in Phoenix, AZ (MST) · Availability as of ${footerDate}`;

  render();
</script>
</body>
</html>
